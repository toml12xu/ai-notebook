<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI Coach · 演示文稿</title>
<script>
  window.DECK_THEMES = {
    paper: { label: "A · 暖纸白", frameBg: "#f7f0e7", chromeBg: "#efe4d6", chromeFg: "#3b2e24" },
    mist:  { label: "B · 清雾蓝", frameBg: "#edf4f8", chromeBg: "#e0ebf2", chromeFg: "#173247" },
    sage:  { label: "C · 松石绿", frameBg: "#eff5ee", chromeBg: "#dfeadd", chromeFg: "#1f3b31" },
  };

  window.DECK_MANIFEST = [
    { file: "slides/01-cover.html",                label: "封面" },
    { file: "slides/02-problem.html",              label: "问题" },
    { file: "slides/03-core-concept.html",         label: "核心理念" },
    { file: "slides/04-session-lifecycle.html",    label: "会话生命周期" },
    { file: "slides/05-teaching-method.html",      label: "教学方法" },
    { file: "slides/06-save-to-obsidian.html",     label: "保存到 Obsidian" },
    { file: "slides/07-diagram-guarantee.html",    label: "图表保障" },
    { file: "slides/08-implementation-planning.html", label: "实施规划" },
    { file: "slides/09-ecosystem.html",            label: "生态矩阵" },
    { file: "slides/10-getting-started.html",      label: "快速开始" },
  ];

  window.DECK_WIDTH = 1920;
  window.DECK_HEIGHT = 1080;
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform-origin: top left;
    will-change: transform;
    background: #fff;
    box-shadow: 0 10px 60px rgba(0,0,0,0.4);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #1a1512;
  }
  .counter {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    z-index: 100;
    user-select: none;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .counter:hover { opacity: 1; }
  .theme-switcher {
    position: fixed;
    top: 20px;
    right: 20px;
    display: none;
    gap: 8px;
    z-index: 100;
    user-select: none;
  }
  .theme-switcher button {
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.58);
    color: rgba(255,255,255,0.78);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .theme-switcher button:hover,
  .theme-switcher button.active {
    background: rgba(255,255,255,0.9);
    color: #1a1512;
    border-color: rgba(255,255,255,0.8);
  }
  .counter .label { color: rgba(255,255,255,0.7); margin-left: 8px; }
  .nav-zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 15%;
    cursor: pointer;
    z-index: 50;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-zone.left  .nav-hint { left: 20px; }
  .nav-zone.right .nav-hint { right: 20px; }
  .nav-zone:hover .nav-hint { opacity: 1; }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; }
    .counter, .nav-zone, .theme-switcher { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe {
      width: 1920px;
      height: 1080px;
      page-break-after: always;
      display: block;
    }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" src="about:blank"></iframe>
</div>

<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="theme-switcher" id="themeSwitcher"></div>
<div class="counter" id="counter">1 / 1</div>

<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const themes = window.DECK_THEMES || {};
  const themeKeys = Object.keys(themes);
  const searchParams = new URLSearchParams(location.search);
  let currentTheme = searchParams.get('theme') || 'paper';
  const showThemePicker = searchParams.get('picker') !== '0';
  if (!themes[currentTheme]) currentTheme = themeKeys[0] || 'paper';
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const themeSwitcher = document.getElementById('themeSwitcher');
  const storageKey = 'deck-index-' + location.pathname;
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0';
    stage.style.left = '0';
  }

  function themedSrc(file) {
    const glue = file.includes('?') ? '&' : '?';
    return `${file}${glue}theme=${encodeURIComponent(currentTheme)}`;
  }

  function applyChromeTheme() {
    const theme = themes[currentTheme] || {};
    stage.style.background = theme.frameBg || '#fff';
    frame.style.background = theme.frameBg || '#fff';
    document.body.style.background = theme.chromeBg || '#0a0a0a';
    document.querySelectorAll('.theme-switcher button').forEach(button => {
      button.classList.toggle('active', button.dataset.theme === currentTheme);
    });
  }

  function setTheme(themeKey) {
    if (!themes[themeKey]) return;
    currentTheme = themeKey;
    const params = new URLSearchParams(location.search);
    params.set('theme', currentTheme);
    const hash = location.hash || '#' + (current + 1);
    history.replaceState(null, '', `${location.pathname}?${params.toString()}${hash}`);
    applyChromeTheme();
    show(current, { keepHash: true });
  }

  function buildThemeSwitcher() {
    if (!showThemePicker) {
      themeSwitcher.style.display = 'none';
      return;
    }
    themeSwitcher.style.display = 'flex';
    themeSwitcher.innerHTML = '';
    themeKeys.forEach(key => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.theme = key;
      button.textContent = themes[key].label || key;
      button.addEventListener('click', () => setTheme(key));
      themeSwitcher.appendChild(button);
    });
    applyChromeTheme();
  }

  function show(idx, options = {}) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = themedSrc(deck[idx].file);
    const themeLabel = (themes[currentTheme] && themes[currentTheme].label) || currentTheme;
    counter.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''} · ${themeLabel}</span>`;
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (!options.keepHash && location.hash !== '#' + (idx + 1)) {
      const params = new URLSearchParams(location.search);
      params.set('theme', currentTheme);
      history.replaceState(null, '', `${location.pathname}?${params.toString()}#${idx + 1}`);
    }
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P':                             window.print(); break;
      default:
        if (e.key >= '1' && e.key <= '9') {
          const i = parseInt(e.key, 10) - 1;
          if (i < deck.length) { e.preventDefault(); show(i); }
        }
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  buildThemeSwitcher();
  fit();
  show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = themedSrc(item.file);
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    document.getElementById('stage').style.display = '';
  });
})();
</script>

</body>
</html>
