<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>04 · 会话生命周期</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/theme-loader.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  .slide {
    padding: 80px 140px;
    gap: 40px;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232, 148, 90, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232, 148, 90, 0.02) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
  }
  .kicker {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.16em;
  }
  h2 {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 80px;
  }

  /* Left — the big rule */
  .rule-block {
    flex: 1;
  }
  .rule-block .rule-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .rule-block .rule-desc {
    font-size: 17px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .rule-block .triggers {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
  }
  .triggers .triggers-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .triggers ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .triggers li {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Right — lifecycle diagram */
  .lifecycle {
    flex: 0 0 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .phase {
    width: 300px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    text-align: center;
  }
  .phase.active {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .phase .phase-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .phase .phase-sub {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    margin-top: 4px;
  }

  .connector {
    width: 2px;
    height: 20px;
    background: var(--accent);
    opacity: 0.4;
  }

  .loop-back {
    position: absolute;
    right: -20px;
    top: 60px;
    bottom: 60px;
    width: 20px;
    border: 2px solid var(--accent);
    border-left: none;
    border-radius: 0 10px 10px 0;
    opacity: 0.3;
  }
  .loop-back-label {
    position: absolute;
    right: -60px;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.12em;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div>

  <div class="header">
    <div class="accent-line"></div>
    <div class="kicker">架构</div>
    <h2>会话生命周期</h2>
  </div>

  <div class="content">
    <div class="rule-block">
      <div class="rule-title">永不自动结束</div>
      <div class="rule-desc">
        教练会话是一个由用户独占控制的<strong>无限交互循环</strong>。AI 不会在任何子任务完成后自动收尾——保存笔记、展示图表、回答问题后，都必须立即回到循环。
      </div>
      <div class="triggers">
        <div class="triggers-label">仅以下触发词可结束会话</div>
        <ul>
          <li>结束会话</li>
          <li>拜拜</li>
          <li>今天到此为止</li>
          <li>退出</li>
          <li>我们结束了</li>
        </ul>
      </div>
    </div>

    <div class="lifecycle">
      <div class="phase">
        <div class="phase-title">解释 / 教学</div>
        <div class="phase-sub">概念优先</div>
      </div>
      <div class="connector"></div>
      <div class="phase active">
        <div class="phase-title">ask_questions()</div>
        <div class="phase-sub">检查理解 · 引导方向</div>
      </div>
      <div class="connector"></div>
      <div class="phase">
        <div class="phase-title">适应 / 深入 / 保存</div>
        <div class="phase-sub">根据选择分支</div>
      </div>
      <div class="connector"></div>
      <div class="phase active">
        <div class="phase-title">ask_questions()</div>
        <div class="phase-sub">继续 · 新话题 · 结束</div>
      </div>

      <div class="loop-back"></div>
      <div class="loop-back-label">无限循环</div>
    </div>
  </div>

  <div class="page-number">04 / 10</div>
</div>
</body>
</html>
