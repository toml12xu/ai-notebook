<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 · 问题</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/theme-loader.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  .slide {
    padding: 80px 140px;
    justify-content: center;
    gap: 48px;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232, 148, 90, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232, 148, 90, 0.02) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
  }
  .kicker {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  h2 {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .pain-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .pain-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 32px;
    position: relative;
  }
  .pain-card::before {
    content: attr(data-icon);
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 28px;
    opacity: 0.6;
  }
  .pain-card h3 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text-primary);
  }
  .pain-card p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    max-width: 380px;
  }

  .bottom-insight {
    border-top: 1px solid var(--border);
    padding-top: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .bottom-insight .arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 16px;
    flex-shrink: 0;
  }
  .bottom-insight p {
    font-size: 17px;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .bottom-insight p strong {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div>

  <div class="header">
    <div class="accent-line"></div>
    <div class="kicker">痛点</div>
    <h2>传统 AI 对话的学习困境</h2>
  </div>

  <div class="pain-grid">
    <div class="pain-card" data-icon="💬">
      <h3>一问一答，没有引导</h3>
      <p>传统 ChatGPT 式对话直接给出答案，学习者失去思考过程，知识无法内化。</p>
    </div>
    <div class="pain-card" data-icon="📋">
      <h3>聊完即忘，无法沉淀</h3>
      <p>对话结束后，有价值的解释、图表、洞察散落在聊天记录中，无法结构化检索。</p>
    </div>
    <div class="pain-card" data-icon="🔄">
      <h3>被动接收，缺乏互动</h3>
      <p>长篇大论的回复让学习者陷入「阅读模式」，没有主动参与的空间。</p>
    </div>
    <div class="pain-card" data-icon="🎯">
      <h3>节奏失控，无法适配</h3>
      <p>AI 无法感知你是否跟上了——太快则懵，太慢则无聊。缺乏自适应机制。</p>
    </div>
  </div>

  <div class="bottom-insight">
    <div class="arrow">→</div>
    <p>我们需要的不是一个<strong>更聪明的回答者</strong>，而是一个<strong>更好的引导者</strong>。</p>
  </div>

  <div class="page-number">02 / 10</div>
</div>
</body>
</html>
